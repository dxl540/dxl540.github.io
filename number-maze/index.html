<!DOCTYPE html>
<html>

<head>
    <title>Number Maze</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div id="verticalWrapper">
        <select id="levelSelect"></select>
        <div id="levelButtons">
            <button id="previousLevel">Previous</button>
            <button id="resetLevel">Reset</button>
            <button id="nextLevel">Next</button>
        </div>

        <p id="introText"></p>

        <canvas id="game" width="600" height="600"></canvas>

        <div id="controls">
            <button id="upButton">↑</button>
            <button id="leftButton">←</button>
            <button id="undoButton">↶</button>
            <button id="rightButton">→</button>
            <button id="downButton">↓</button>
        </div>
        <p id="status"></p>

    </div>

    <script src="mazes_list.js"></script>
    <script src="maze.js"></script>
</body>
